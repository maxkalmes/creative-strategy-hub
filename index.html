<style>
:root{--ink:#161412;--gold:#B8953F;--gold2:#D4AF6A;--cream:#FAF7F2;--cream2:#F2EDE4;--teal:#2ABFBF;--navy:#1B4B5A;--surface:#FFFFFF;--muted:#8A8278;--subtle:#B5AFA6;--border:#E2DAD0;--danger:#C94040;--r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:28px;--shadow-sm:0 1px 4px rgba(22,20,18,.06);--shadow-md:0 4px 20px rgba(22,20,18,.09);--shadow-lg:0 12px 48px rgba(22,20,18,.13)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:'DM Sans',sans-serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
#loading{position:fixed;inset:0;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:9999}
.l-wordmark{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:var(--ink);letter-spacing:.14em;text-transform:uppercase}
.l-sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:500}
.l-bar{width:120px;height:2px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:8px}
@keyframes bar-slide{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
.l-bar-fill{height:100%;width:50%;background:var(--gold);border-radius:2px;animation:bar-slide 1.4s ease-in-out infinite}
.topbar{height:56px;background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:200}
.topbar-left{display:flex;align-items:center;gap:16px}
.wordmark{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;color:var(--gold2);letter-spacing:.18em;text-transform:uppercase}
.topbar-sep{width:1px;height:20px;background:#333}
.topbar-title{font-size:12px;font-weight:500;color:rgba(255,255,255,.5);letter-spacing:.06em}
.sync-wrap{display:flex;align-items:center;gap:8px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#f59e0b;transition:background .5s;flex-shrink:0}
.sync-dot.live{background:#6ee7b7}.sync-dot.saving{background:#f59e0b}
.sync-txt{font-size:11px;color:rgba(255,255,255,.35);font-weight:500;letter-spacing:.04em}
#app{display:none}
.page{padding:36px 40px;max-width:1520px;margin:0 auto}
@media(max-width:800px){.page{padding:24px 20px}}
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:28px}
.bc-item{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);cursor:pointer;transition:color .15s}
.bc-item:hover{color:var(--ink)}.bc-item.active{color:var(--ink)}
.bc-sep{color:var(--border);font-size:14px}
.page-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:32px;flex-wrap:wrap}
.page-title{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:600;color:var(--ink);line-height:1.1;letter-spacing:-.5px}
.page-sub{font-size:12px;color:var(--muted);margin-top:6px;font-weight:400}
.hdr-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stat-strip{display:flex;gap:12px;margin-bottom:32px;flex-wrap:wrap}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 22px;flex:1;min-width:100px;box-shadow:var(--shadow-sm)}
.stat-card.accent{background:var(--ink);border-color:var(--ink)}
.stat-n{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;line-height:1;color:var(--ink)}
.stat-card.accent .stat-n{color:var(--gold2)}
.stat-l{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.stat-card.accent .stat-l{color:rgba(255,255,255,.35)}
.filter-bar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:28px}
.ftab{padding:7px 16px;border-radius:var(--r-sm);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;border:1.5px solid transparent;background:var(--surface);transition:all .15s;white-space:nowrap}
.ftab:hover{background:var(--cream2)}.ftab.on{background:var(--ink);color:var(--gold2);border-color:var(--ink)}
.btn{padding:9px 20px;border-radius:var(--r-md);font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px;letter-spacing:.04em;white-space:nowrap}
.btn-dark{background:var(--ink);color:var(--gold2)}.btn-dark:hover{background:#2a2520}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border)}.btn-ghost:hover{background:var(--cream2)}
.btn-danger{background:#fef2f2;color:var(--danger);border:none}.btn-danger:hover{background:#fee2e2}
.btn-sm{padding:6px 14px;font-size:11px;border-radius:var(--r-sm)}
.btn-xs{padding:4px 10px;font-size:10px;border-radius:6px}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);overflow:hidden;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm)}
.pcard:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--gold)}
.pcard-stripe{height:4px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.pcard-body{padding:20px 22px 18px}
.pcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.pcard-name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;color:var(--ink);line-height:1.25}
.pcard-cat{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:20px;background:var(--cream2);color:var(--muted);flex-shrink:0;margin-top:3px}
.pcard-preview{font-size:12px;color:var(--muted);line-height:1.65;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.angle-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.angle-chip{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;border:1.5px solid;letter-spacing:.03em}
.pcard-footer{display:flex;align-items:center;justify-content:space-between}
.pcard-acts{display:flex;gap:5px;opacity:0;transition:opacity .15s}
.pcard:hover .pcard-acts{opacity:1}
.task-summary{font-size:11px;color:var(--subtle);font-weight:500}
.stage-pill{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.detail-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:32px}
.detail-name{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:600;color:var(--ink);letter-spacing:-.3px}
.detail-meta{font-size:12px;color:var(--muted);margin-top:5px}
.itabs{display:flex;gap:3px;background:var(--cream2);border-radius:12px;padding:4px;width:fit-content;margin-bottom:28px}
.itab{padding:8px 20px;border-radius:9px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;border:none;background:transparent;transition:all .15s}
.itab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.strat-intro{font-size:12px;color:var(--muted);margin-bottom:22px;line-height:1.7;max-width:640px}
.strat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.strat-grid{grid-template-columns:1fr}}
.sq-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;transition:border-color .2s;box-shadow:var(--shadow-sm)}
.sq-card:focus-within{border-color:var(--gold)}
.sq-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.sq-tag{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:4px;flex-shrink:0;margin-top:2px}
.tag-core{background:#FFF8E7;color:#92650A}.tag-connect{background:#EEF6FF;color:#1D5FA6}
.tag-hook{background:#F0FDF4;color:#166534}.tag-convert{background:#FDF4FF;color:#7E22CE}.tag-proof{background:#FFF1F2;color:#9F1239}
.sq-q{font-size:12px;font-weight:600;color:#374151;line-height:1.55;flex:1}
.sq-answers{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.answer-row{display:flex;gap:6px;align-items:flex-start}
.answer-txt{flex:1;padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:12px;color:var(--ink);outline:none;transition:border-color .15s;background:#FAFAF8;line-height:1.55;resize:none;min-height:48px}
.answer-txt:focus{border-color:var(--gold);background:#fff}
.answer-txt::placeholder{color:var(--subtle)}
.answer-del{width:24px;height:24px;border-radius:6px;border:none;background:transparent;color:var(--subtle);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;margin-top:4px}
.answer-del:hover{background:#fee2e2;color:var(--danger)}
.add-answer-btn{font-size:11px;font-weight:600;color:var(--muted);background:transparent;border:1.5px dashed var(--border);border-radius:var(--r-sm);padding:6px 12px;cursor:pointer;transition:all .15s;width:100%;text-align:left}
.add-answer-btn:hover{border-color:var(--gold);color:var(--gold);background:#FFFBF2}
.angles-wrap{display:flex;flex-direction:column;gap:12px}
.angle-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);overflow:hidden;transition:all .2s;box-shadow:var(--shadow-sm)}
.angle-card:hover{border-color:var(--gold);box-shadow:var(--shadow-md)}
.angle-card-top{padding:16px 20px;display:flex;align-items:center;gap:12px;cursor:pointer}
.angle-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.angle-title{font-weight:700;font-size:14px;color:var(--ink);flex:1}
.angle-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.angle-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s;margin-left:4px}
.angle-card:hover .angle-actions{opacity:1}
.angle-body{padding:0 20px 18px;display:none}.angle-body.open{display:block}
.pipeline{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--border);margin-bottom:20px}
.pip-btn{flex:1;padding:9px 4px;font-size:9px;font-weight:800;border:none;cursor:pointer;transition:all .15s;text-align:center;letter-spacing:.08em;text-transform:uppercase;border-right:1px solid rgba(0,0,0,.06)}
.pip-btn:last-child{border-right:none}
.btabs{display:flex;gap:3px;background:var(--cream2);border-radius:10px;padding:3px;width:fit-content;margin-bottom:16px}
.btab{padding:7px 16px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);cursor:pointer;border:none;background:transparent;transition:all .15s}
.btab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.brief-date-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--gold);background:#FFF8E7;border:1px solid #F0DFA0;border-radius:20px;padding:4px 12px;margin-bottom:16px}
.brief-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.brief-grid{grid-template-columns:1fr}}
.brief-field{background:var(--cream);border:1px solid var(--border);border-radius:var(--r-md);padding:14px}
.brief-lbl{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--subtle);margin-bottom:6px}
.brief-val{font-size:12px;color:var(--ink);line-height:1.65;white-space:pre-wrap}
.brief-nil{font-size:12px;color:var(--subtle);font-style:italic}
.source-banner{background:var(--cream2);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:12px;color:var(--muted);line-height:1.5}
.source-banner strong{color:var(--navy);font-weight:700}
.source-quote{margin-top:5px;font-style:italic;color:var(--ink)}
.tasks-list{display:flex;flex-direction:column;gap:7px}
.task-row{background:var(--cream);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;display:flex;gap:10px;align-items:flex-start;transition:all .15s}
.task-row:hover{background:var(--surface);box-shadow:var(--shadow-sm)}
.tchk{width:20px;height:20px;border-radius:5px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
.tchk.done{background:var(--teal);border-color:var(--teal);color:#fff}
.tbody{flex:1;min-width:0}
.t-title{font-size:13px;font-weight:600;color:var(--ink)}.t-title.done{text-decoration:line-through;color:var(--subtle)}
.t-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px}
.t-assignee{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--cream2);color:var(--navy)}
.t-assigned{font-size:10px;color:var(--subtle)}
.t-due{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px}
.t-due.ok{background:#f0fdf4;color:#166534}.t-due.soon{background:#fef9c3;color:#854d0e}.t-due.late{background:#fee2e2;color:var(--danger)}
.t-acts{display:flex;gap:4px;opacity:0;transition:opacity .15s;flex-shrink:0}
.task-row:hover .t-acts{opacity:1}
.icon-btn{width:26px;height:26px;border-radius:7px;border:none;background:var(--cream2);color:var(--muted);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.icon-btn:hover{background:var(--border)}.icon-btn.del{background:#fef2f2;color:var(--danger)}.icon-btn.del:hover{background:#fee2e2}
.modal-bg{position:fixed;inset:0;background:rgba(22,20,18,.5);display:flex;align-items:flex-start;justify-content:center;z-index:1000;padding:48px 16px;overflow-y:auto;backdrop-filter:blur(6px)}
.modal{background:var(--surface);border-radius:var(--r-xl);width:100%;max-width:680px;overflow:hidden;box-shadow:var(--shadow-lg)}
.modal-head{padding:24px 28px 18px;border-bottom:1px solid var(--cream2);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--ink)}
.modal-close{width:30px;height:30px;border-radius:8px;border:none;background:var(--cream2);color:var(--muted);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-close:hover{background:var(--border)}
.modal-body{padding:24px 28px;max-height:66vh;overflow-y:auto}
.modal-foot{padding:14px 28px;border-top:1px solid var(--cream2);display:flex;gap:8px;justify-content:flex-end}
.frow{margin-bottom:16px}
.flabel{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#374151;margin-bottom:6px;display:block}
.finput{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:13px;color:var(--ink);outline:none;transition:border-color .15s;background:#FAFAF8;line-height:1.5}
.finput:focus{border-color:var(--gold);background:#fff}
textarea.finput{resize:vertical;min-height:80px;line-height:1.6}
.stage-picker{display:flex;gap:5px;flex-wrap:wrap}
.spick{padding:5px 13px;border-radius:var(--r-sm);font-size:11px;font-weight:700;border:1.5px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;transition:all .15s}
.color-row{display:flex;gap:8px;flex-wrap:wrap}
.cpick{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .15s}
.cpick.on{border-color:var(--ink);transform:scale(1.15)}
.branch-list{display:flex;flex-direction:column;gap:6px}
.branch-row{padding:10px 13px;border-radius:10px;border:1.5px solid var(--border);cursor:pointer;transition:all .15s;background:var(--cream)}
.branch-row.on{border-color:var(--gold);background:#FFFBF2}
.branch-q{font-size:11px;font-weight:700;color:#374151;margin-bottom:3px}
.branch-a{font-size:11px;color:var(--muted);font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brief-ctx{background:#EEF6FF;border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:12px;color:#1D5FA6;line-height:1.6}
.empty{text-align:center;padding:56px 24px;color:var(--subtle)}
.empty-icon{font-size:34px;margin-bottom:14px}
.empty-txt{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--muted);margin-bottom:5px}
.empty-sub{font-size:12px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px}
.sec-desc{font-size:12px;color:var(--subtle)}

/* ─── REVIEWS TAB ─────────────────────────── */
.sheet-setup{background:var(--surface);border:1.5px dashed var(--border);border-radius:var(--r-lg);padding:28px;text-align:center;margin-bottom:24px}
.sheet-setup-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--ink);margin-bottom:6px}
.sheet-setup-sub{font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.6;max-width:480px;margin-left:auto;margin-right:auto}
.sheet-input-row{display:flex;gap:8px;max-width:560px;margin:0 auto}
.sheet-input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:12px;color:var(--ink);outline:none;background:#FAFAF8;transition:border-color .15s}
.sheet-input:focus{border-color:var(--gold)}

.reviews-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.reviews-meta{font-size:12px;color:var(--muted)}
.reviews-filters{display:flex;gap:6px;flex-wrap:wrap}
.rfil{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s}
.rfil:hover{background:var(--cream2)}
.rfil.on{background:var(--ink);color:var(--gold2);border-color:var(--ink)}

.reviews-grid{display:flex;flex-direction:column;gap:10px}
.review-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;transition:all .2s;box-shadow:var(--shadow-sm)}
.review-card:hover{border-color:var(--gold);box-shadow:var(--shadow-md)}
.review-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.review-left{display:flex;align-items:center;gap:10px}
.review-avatar{width:34px;height:34px;border-radius:50%;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--navy);flex-shrink:0;border:1.5px solid var(--border)}
.review-name{font-weight:700;font-size:13px;color:var(--ink)}
.review-product{font-size:11px;color:var(--muted);margin-top:1px}
.review-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.stars{display:flex;gap:2px}
.star{font-size:12px;color:#D4AF6A}
.star.empty{color:var(--border)}
.sentiment-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase}
.sent-positive{background:#dcfce7;color:#166534}
.sent-negative{background:#fee2e2;color:#9f1239}
.sent-neutral{background:#fef9c3;color:#854d0e}
.review-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:5px}
.review-body{font-size:12px;color:#374151;line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.review-body.expanded{-webkit-line-clamp:unset;overflow:visible}
.review-expand{font-size:11px;font-weight:600;color:var(--gold);background:none;border:none;cursor:pointer;padding:4px 0;margin-top:4px;letter-spacing:.02em}
.review-footer{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--cream2)}
.review-date{font-size:10px;color:var(--subtle)}

/* generated angles from review */
.gen-angles-wrap{margin-top:14px;padding-top:14px;border-top:1px solid var(--cream2)}
.gen-angles-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle);margin-bottom:10px}
.gen-angle-item{background:var(--cream);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.gen-angle-text{flex:1}
.gen-angle-hook{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:3px}
.gen-angle-why{font-size:11px;color:var(--muted);line-height:1.55}
.gen-angle-save{flex-shrink:0}

/* loading spinner for AI */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
.generating-msg{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;padding:12px 0}

.sync-bar{display:flex;align-items:center;gap:10px;background:var(--cream2);border-radius:var(--r-md);padding:10px 16px;margin-bottom:20px}
.sync-bar-url{flex:1;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-bar-actions{display:flex;gap:6px;flex-shrink:0}

// Convert any Google Sheets URL → CSV export URL
function sheetToCsvUrl(url) {
  var m = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
  if (!m) return null;
  var id = m[1];
  var gidM = url.match(/[#&?]gid=([0-9]+)/);
  var gid = gidM ? gidM[1] : '0';
  return 'https://docs.google.com/spreadsheets/d/' + id + '/export?format=csv&gid=' + gid;
}

// Parse CSV text → array of objects using header row
function parseCsv(text) {
  var lines = text.split(/\r?\n/).filter(function(l){ return l.trim(); });
  if (lines.length < 2) return [];
  function splitCsvRow(row) {
    var result = [], cur = '', inQ = false;
    for (var i = 0; i < row.length; i++) {
      var ch = row[i];
      if (ch === '"') {
        if (inQ && row[i+1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (ch === ',' && !inQ) {
        result.push(cur); cur = '';
      } else cur += ch;
    }
    result.push(cur);
    return result;
  }
  var headers = splitCsvRow(lines[0]);
  return lines.slice(1).map(function(line) {
    var vals = splitCsvRow(line);
    var obj = {};
    headers.forEach(function(hdr, i){ obj[hdr.trim()] = (vals[i] || '').trim(); });
    return obj;
  }).filter(function(r){ return r['Body'] || r['Title']; });
}
// Sync sheet for a product
async function syncSheet(pid) {
  var p = DB.products[pid];
  if (!p.sheetUrl) return;

  // Extract spreadsheet ID
  var mId = p.sheetUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
  if (!mId) { alert('Invalid Google Sheets URL'); return; }
  var sheetId = mId[1];

  setSyncStatus('saving');
  try {
    // Step 1: fetch the sheet metadata to get all tab gids + names
    var metaUrl = 'https://docs.google.com/spreadsheets/d/' + sheetId + '/edit';
    // We can't read metadata directly — instead, we fetch each known gid
    // The user's sheet has named tabs. We fetch the main export (all sheets merged)
    // by using the gid list stored on the product, or default to scanning gid 0,1,2...
    // Best approach for multi-tab: fetch each tab by gid sequentially until we get empty

    var allRows = [];
    var tabNames = p.sheetTabs || []; // [{gid, name}] stored after first sync

    if (tabNames.length === 0) {
      // First sync: just fetch gid=0 and store — user can add more tabs manually
      var csvUrl0 = 'https://docs.google.com/spreadsheets/d/' + sheetId + '/export?format=csv&gid=0';
      var r0 = await fetch(csvUrl0);
      if (!r0.ok) throw new Error('Could not fetch sheet. Make sure it is shared as "Anyone with link can view".');
      var t0 = await r0.text();
      var rows0 = parseCsv(t0);
      rows0.forEach(function(row){ row._tab = 'Tab 1'; });
      allRows = allRows.concat(rows0);
      // Try to auto-detect more tabs (gid 1..5)
      for (var g = 1; g <= 5; g++) {
        try {
          var csvUrlG = 'https://docs.google.com/spreadsheets/d/' + sheetId + '/export?format=csv&gid=' + g;
          var rG = await fetch(csvUrlG);
          if (!rG.ok) break;
          var tG = await rG.text();
          if (tG.includes('<!DOCTYPE') || tG.includes('<html')) break; // got an error page
          var rowsG = parseCsv(tG);
          if (rowsG.length === 0) break;
          rowsG.forEach(function(row){ row._tab = 'Tab ' + (g+1); });
          allRows = allRows.concat(rowsG);
        } catch(e) { break; }
      }
    } else {
      // Subsequent syncs: fetch all stored tabs
      for (var ti = 0; ti < tabNames.length; ti++) {
        var tab = tabNames[ti];
        var csvUrl = 'https://docs.google.com/spreadsheets/d/' + sheetId + '/export?format=csv&gid=' + tab.gid;
        var resp = await fetch(csvUrl);
        if (!resp.ok) continue;
        var text = await resp.text();
        if (text.includes('<!DOCTYPE') || text.includes('<html')) continue;
        var rows = parseCsv(text);
        rows.forEach(function(row){ row._tab = tab.name; });
        allRows = allRows.concat(rows);
      }
    }

    if (!DB.products[pid].reviews) DB.products[pid].reviews = {};
    // Clear old reviews and replace with fresh data
    DB.products[pid].reviews = {};
    allRows.forEach(function(row, i) {
      var key = (row['Okendo ID'] || ('row_'+i)).replace(/[^a-zA-Z0-9_-]/g,'_');
      // Avoid key collisions across tabs
      while (DB.products[pid].reviews[key]) key = key + '_x';
      DB.products[pid].reviews[key] = {
        id:        row['Okendo ID'] || '',
        name:      row['Name'] || 'Anonymous',
        sentiment: (row['Sentiment'] || 'neutral').toLowerCase(),
        rating:    parseInt(row['Rating']) || 0,
        product:   row['Product'] || '',
        title:     row['Title'] || '',
        body:      row['Body'] || '',
        tab:       row['_tab'] || '',
        synced:    Date.now(),
      };
    });
    p.lastSynced = Date.now();
    save();
    setSyncStatus('live');
    render();
  } catch(e) {
    setSyncStatus('live');
    alert('Sync failed: ' + e.message);
  }
}

// Add a tab manually by gid
async function addSheetTab(pid, gid, name) {
  var p = DB.products[pid];
  if (!p.sheetTabs) p.sheetTabs = [];
  // Remove existing entry with same gid
  p.sheetTabs = p.sheetTabs.filter(function(t){ return t.gid !== gid; });
  p.sheetTabs.push({gid: gid, name: name});
  await syncSheet(pid);
}

function buildReviewCard(pid, p, r) {
  const card = h('div', {class:'review-card'});
  card.dataset.reviewId = r.id;

  // Top row
  const top = h('div', {class:'review-card-top'});
  const left = h('div', {class:'review-left'});
  const initials = (r.name||'?').split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
  left.appendChild(h('div', {class:'review-avatar'}, initials));
  const nameWrap = h('div', {});
  nameWrap.appendChild(h('div', {class:'review-name'}, r.name || 'Anonymous'));
  if (r.product) nameWrap.appendChild(h('div', {class:'review-product'}, r.product));
  left.appendChild(nameWrap);
  top.appendChild(left);

  const right = h('div', {class:'review-right'});
  // Stars
  if (r.rating) {
    const stars = h('div', {class:'stars'});
    for (let i=1; i<=5; i++) stars.appendChild(h('span', {class:'star'+(i>r.rating?' empty':'')}, '★'));
    right.appendChild(stars);
  }
  const sentCls = {positive:'sent-positive', negative:'sent-negative', neutral:'sent-neutral'}[r.sentiment] || 'sent-neutral';
  right.appendChild(h('span', {class:'sentiment-badge '+sentCls}, r.sentiment || 'neutral'));
  top.appendChild(right);
  card.appendChild(top);

  // Title + body
  if (r.title) card.appendChild(h('div', {class:'review-title'}, r.title));
  const bodyEl = h('div', {class:'review-body'}, r.body || '');
  card.appendChild(bodyEl);
  if ((r.body||'').length > 200) {
    let expanded = false;
    const expBtn = h('button', {class:'review-expand', onclick:() => {
      expanded = !expanded;
      bodyEl.classList.toggle('expanded', expanded);
      expBtn.textContent = expanded ? 'Show less' : 'Read more';
    }}, 'Read more');
    card.appendChild(expBtn);
  }

  // Footer
  const footer = h('div', {class:'review-footer'});
  footer.appendChild(h('span', {class:'review-date'}, r.id ? 'ID: '+r.id.slice(0,12)+'…' : ''));

  // Generate angles button
  const genWrap = h('div', {});
  const genBtn = h('button', {class:'btn btn-dark btn-xs', onclick: () => generateAnglesFromReview(pid, p, r, card, genBtn)},
    '✦ Generate Angles'
  );
  genWrap.appendChild(genBtn);
  footer.appendChild(genWrap);
  card.appendChild(footer);

  return card;
}

// Call Claude API to generate angles from a review
async function generateAnglesFromReview(pid, p, review, card, btn) {
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Generating…';

  // Remove any existing generated angles
  const existing = card.querySelector('.gen-angles-wrap');
  if (existing) existing.remove();

  // Build strategy context
  const strat = p.strategy || {};
  const stratLines = Object.entries(strat).map(([k,v]) => {
    const q = STRATEGY_QS.find(q=>q.id===k);
    if (!q) return '';
    const vals = Array.isArray(v) ? v.filter(Boolean) : [v].filter(Boolean);
    if (!vals.length) return '';
    return `${q.label}: ${vals.join(' / ')}`;
  }).filter(Boolean).join('\n');

  const prompt = `You are a creative strategist for Kopari Beauty, a premium skincare and beauty brand.

PRODUCT: ${p.name || 'Kopari product'}
${stratLines ? 'STRATEGY CONTEXT:\n' + stratLines : ''}

CUSTOMER REVIEW:
Reviewer: ${review.name}
Rating: ${review.rating}/5 stars
Sentiment: ${review.sentiment}
Title: "${review.title}"
Review: "${review.body}"

Based on this specific review, generate exactly 3 ad angle ideas. Each angle should:
- Use the customer's own language or emotional truth as a hook
- Be specific to what THIS reviewer said (not generic)
- Be actionable as a paid social ad concept (Meta/Instagram)

Respond ONLY with valid JSON in this exact format, no markdown, no extra text:
{
  "angles": [
    {"hook": "Short punchy hook (under 10 words)", "why": "1-2 sentences on why this angle works and how to execute it"},
    {"hook": "Short punchy hook (under 10 words)", "why": "1-2 sentences on why this angle works and how to execute it"},
    {"hook": "Short punchy hook (under 10 words)", "why": "1-2 sentences on why this angle works and how to execute it"}
  ]
}`;

  // Get API key from Firebase (shared across all team members)
  const apiKey = DB.settings && DB.settings.anthropicKey;
  if (!apiKey) {
    btn.disabled = false;
    btn.innerHTML = '✦ Generate Angles';
    openApiKeyModal();
    return;
  }

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if (!res.ok) {
      const errData = await res.json().catch(()=>({}));
      throw new Error(errData.error?.message || 'API error ' + res.status);
    }
    const data = await res.json();
    const raw = (data.content || []).map(c => c.text || '').join('');
    const clean = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    const angles = parsed.angles || [];

    // Render generated angles
    const genWrap = h('div', {class:'gen-angles-wrap'});
    genWrap.appendChild(h('div', {class:'gen-angles-title'}, '✦ Generated Angles from this Review'));
    angles.forEach(angle => {
      const item = h('div', {class:'gen-angle-item'});
      const txt = h('div', {class:'gen-angle-text'});
      txt.appendChild(h('div', {class:'gen-angle-hook'}, angle.hook));
      txt.appendChild(h('div', {class:'gen-angle-why'}, angle.why));
      item.appendChild(txt);
      // Save angle button
      const saveBtn = h('button', {class:'btn btn-dark btn-xs gen-angle-save', onclick: () => {
        if (!DB.products[pid].angles) DB.products[pid].angles = {};
        const nid = genId();
        DB.products[pid].angles[nid] = {
          name: angle.hook,
          color: ANGLE_COLORS[Math.floor(Math.random()*ANGLE_COLORS.length)],
          stage: 'Strategy',
          sourceQuestion: null,
          sourceAnswer: null,
          sourceReview: review.body.slice(0, 120),
          brief: { objective: angle.why, hooks: angle.hook },
          tasks: []
        };
        save();
        saveBtn.textContent = '✓ Saved';
        saveBtn.disabled = true;
        css(saveBtn, {background:'#dcfce7', color:'#166534'});
      }}, '+ Save Angle');
      item.appendChild(saveBtn);
      genWrap.appendChild(item);
    });
    card.appendChild(genWrap);
  } catch(e) {
    const errWrap = h('div', {class:'gen-angles-wrap'});
    errWrap.appendChild(css(h('div', {}, '⚠ Could not generate angles. Check your connection and try again.'), {fontSize:'12px', color:'var(--danger)', padding:'10px 0'}));
    card.appendChild(errWrap);
  }

  btn.disabled = false;
  btn.innerHTML = '↻ Regenerate';
}


// ── API KEY MODAL ──
function openApiKeyModal() {
  const existing = document.getElementById('apiKeyModal');
  if (existing) { existing.remove(); }

  const bg = mkBg();
  bg.id = 'apiKeyModal';
  const modal = h('div', {class:'modal'});
  modal.appendChild(mkHead('AI Settings', () => bg.remove()));

  const mb = h('div', {class:'modal-body'});

  const info = h('div', {});
  css(info, {background:'#FFF8E7', border:'1px solid #F0DFA0', borderRadius:'10px', padding:'12px 14px', marginBottom:'18px', fontSize:'12px', color:'#92650A', lineHeight:'1.6'});
  info.innerHTML = '<strong>Shared across your whole team.</strong> Add your Anthropic API key once and everyone with access to this tool can use AI angle generation automatically. Get a key at <a href="https://console.anthropic.com" target="_blank" style="color:#B8953F;font-weight:700;">console.anthropic.com</a>.';
  mb.appendChild(info);

  const r = h('div', {class:'frow'});
  r.appendChild(h('label', {class:'flabel'}, 'Anthropic API Key'));
  const inp = h('input', {class:'finput', placeholder:'sk-ant-...'});
  const saved = DB.settings && DB.settings.anthropicKey;
  if (saved) inp.value = saved;
  inp.type = 'password';
  r.appendChild(inp);
  mb.appendChild(r);

  const toggle = h('button', {class:'btn btn-ghost btn-xs', onclick:()=>{
    inp.type = inp.type === 'password' ? 'text' : 'password';
    toggle.textContent = inp.type === 'password' ? 'Show' : 'Hide';
  }}, 'Show');
  css(toggle, {marginTop:'-8px', marginBottom:'12px'});
  mb.appendChild(toggle);

  modal.appendChild(mb);
  const mf = h('div', {class:'modal-foot'});
  if (saved) {
    mf.appendChild(h('button', {class:'btn btn-danger', onclick:()=>{
      if (!DB.settings) DB.settings = {};
      delete DB.settings.anthropicKey;
      save();
      updateApiKeyBtn();
      bg.remove();
    }}, 'Remove Key'));
  }
  mf.appendChild(h('button', {class:'btn btn-ghost', onclick:()=>bg.remove()}, 'Cancel'));
  mf.appendChild(h('button', {class:'btn btn-dark', onclick:()=>{
    const key = inp.value.trim();
    if (!key.startsWith('sk-')) { alert("Doesn't look like a valid key — should start with sk-ant-"); return; }
    if (!DB.settings) DB.settings = {};
    DB.settings.anthropicKey = key;
    save();
    updateApiKeyBtn();
    bg.remove();
  }}, 'Save for Everyone'));
  modal.appendChild(mf);
  bg.appendChild(modal);
  document.body.appendChild(bg);
  setTimeout(() => inp.focus(), 50);
}

function updateApiKeyBtn() {
  const btn = document.getElementById('apiKeyBtn');
  if (!btn) return;
  const hasKey = DB.settings && DB.settings.anthropicKey;
  btn.textContent = hasKey ? '✓ AI Ready' : '⚙ AI Key';
  btn.style.color = hasKey ? '#6ee7b7' : 'rgba(255,255,255,0.6)';
  btn.style.borderColor = hasKey ? 'rgba(110,231,183,0.3)' : 'rgba(255,255,255,0.15)';
}

// API key button updated after Firebase loads via updateApiKeyBtn()
if(window.__fbReady)initFB();
else document.addEventListener("fb-ready",initFB);
</script>
</body>
</html>
